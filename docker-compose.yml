services:
  postgres:
    image: postgres:16-alpine
    container_name: medscribe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medscribe
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: medscribe
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: medscribe-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    container_name: medscribe-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: medscribe
      MINIO_ROOT_PASSWORD: localdevpassword123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  redis-data:
  minio-data: